<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دخول الإدارة | KATANA PARFUM</title>
  <link rel="stylesheet" href="/client/css/style.css">
</head>
<body>
  <main class="section" style="max-width:520px">
    <a class="brand" href="/">
      <span class="brand-mark">K</span>
      <span>KATANA <small>ADMIN</small></span>
    </a>
    <div class="section-heading" style="margin-top:70px">
      <div><p class="eyebrow">CONTROL ROOM</p><h2>دخول الإدارة</h2></div>
    </div>
    <form id="adminLoginForm" class="finder-form" style="color:#111">
      <label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label>
      <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-gold" type="submit">دخول <span>←</span></button>
    </form>
    <p id="adminLoginMessage" role="alert" aria-live="polite"></p>
    <a class="text-link" href="/">العودة إلى المتجر</a>
  </main>
  <script>
    document.getElementById('adminLoginForm').onsubmit = async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const message = document.getElementById('adminLoginMessage');
      button.disabled = true;
      message.textContent = 'جاري تسجيل الدخول...';

      try {
        const response = await fetch('/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json') ? await response.json() : null;
        if (!response.ok) throw new Error(data?.message || `تعذر تسجيل الدخول (HTTP ${response.status})`);
        if (!data?.user || !data?.token) throw new Error('استجابة الخادم غير مكتملة. حاول مرة أخرى لاحقًا.');
        if (data.user.role !== 'admin') throw new Error('هذا الحساب ليس لديه صلاحيات الإدارة');

        localStorage.setItem('katana-token', data.token);
        localStorage.setItem('katana-user', JSON.stringify(data.user));
        location.href = '/admin/dashboard.html';
      } catch (error) {
        message.textContent = error instanceof TypeError
          ? 'تعذر الاتصال بالخادم. حاول مرة أخرى لاحقًا.'
          : error.message;
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
