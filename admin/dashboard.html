<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة | KATANA PARFUM</title>
  <link rel="stylesheet" href="/client/css/style.css">
  <style>
    body{background:#f7f6f2}
    .admin-shell{max-width:1100px;min-height:100vh;margin:auto;padding:30px 24px 56px}
    .admin-top,.admin-panel{border:1px solid #eeece6;border-radius:12px;padding:20px;background:#fff}
    .admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px}
    .admin-actions{display:flex;gap:10px}
    .admin-button{display:inline-flex;justify-content:center;align-items:center;min-height:42px;border:1px solid var(--line);border-radius:7px;padding:10px 16px;font-size:12px}
    .admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}
    .admin-stat{border:1px solid #eeece6;border-radius:10px;padding:18px;background:#fff}
    .admin-stat small{color:var(--muted)}
    .admin-stat strong{display:block;margin-top:8px;font-size:28px}
    .admin-panel{margin-top:16px}
    .notice{line-height:1.9;color:#56524c}
    .admin-table-wrap{overflow-x:auto}
    .admin-table{width:100%;border-collapse:collapse}
    .admin-table th,.admin-table td{text-align:right;padding:13px 10px;border-bottom:1px solid #f0eee9;font-size:12px}
    .admin-table th{color:var(--muted);white-space:nowrap}
    @media(max-width:600px){.admin-shell{padding:16px 12px}.admin-top{align-items:flex-start;flex-direction:column}.admin-grid{gap:8px}.admin-stat{padding:14px}}
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-top">
      <a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>ADMIN</small></span></a>
      <div class="admin-actions">
        <a class="admin-button" href="/">عرض المتجر</a>
        <button class="admin-button" id="logoutButton" type="button">تسجيل الخروج</button>
      </div>
    </header>
    <div class="section-heading"><div><p class="eyebrow">CONTROL ROOM</p><h1>لوحة الإدارة</h1></div></div>
    <section class="admin-grid" aria-label="المنتجات">
      <div class="admin-stat"><small>المنتجات المتاحة</small><strong id="statProducts">--</strong></div>
      <div class="admin-stat"><small>إدارة الطلبات</small><strong>واتساب</strong></div>
    </section>
    <section class="admin-panel">
      <p class="notice">الطلبات كتوصل مباشرة لواتساب الإدارة، وما كتتخزنش فالموقع. باش تزيد أو تبدل منتج، عدّل الملف <code>server/data/products.json</code> فالمشروع ثم أعد النشر.</p>
    </section>
    <section class="admin-panel">
      <h2>المنتجات</h2>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th></tr></thead>
          <tbody id="productRows"><tr><td colspan="4">جاري التحميل...</td></tr></tbody>
        </table>
      </div>
      <p id="dashboardMessage" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('katana-token');
    const dashboardMessage = document.getElementById('dashboardMessage');
    const money = value => `${Number(value || 0).toLocaleString('fr-MA')} DH`;

    async function request(url) {
      const response = await fetch(url, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const contentType = response.headers.get('content-type') || '';
      const data = contentType.includes('application/json') ? await response.json() : null;
      if (!response.ok) {
        const error = new Error(data?.message || `تعذر تنفيذ العملية (HTTP ${response.status})`);
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function loadDashboard() {
      if (!token) {
        location.href = '/admin/login.html';
        return;
      }

      try {
        const [{ user }, catalog] = await Promise.all([
          request('/api/auth/me'),
          request('/api/products?limit=100')
        ]);
        if (user.role !== 'admin') {
          location.href = '/admin/login.html';
          return;
        }

        document.getElementById('statProducts').textContent = catalog.total;
        const rows = document.getElementById('productRows');
        rows.replaceChildren();
        if (!catalog.products.length) {
          const row = rows.insertRow();
          const cell = row.insertCell();
          cell.colSpan = 4;
          cell.textContent = 'لا توجد منتجات';
          return;
        }
        for (const product of catalog.products) {
          const row = rows.insertRow();
          row.insertCell().textContent = product.name;
          row.insertCell().textContent = product.category;
          row.insertCell().textContent = money(product.price);
          row.insertCell().textContent = product.stock;
        }
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          localStorage.removeItem('katana-token');
          localStorage.removeItem('katana-user');
          location.href = '/admin/login.html';
          return;
        }
        dashboardMessage.textContent = error.message;
      }
    }

    document.getElementById('logoutButton').onclick = () => {
      localStorage.removeItem('katana-token');
      localStorage.removeItem('katana-user');
      location.href = '/admin/login.html';
    };
    loadDashboard();
  </script>
</body>
</html>
