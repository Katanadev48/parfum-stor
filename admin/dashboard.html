<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة | KATANA PARFUM</title>
  <link rel="stylesheet" href="/client/css/style.css">
  <style>
    .admin-shell{max-width:1320px;margin:auto;padding:38px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:42px}.admin-top .brand{flex-shrink:0}.admin-actions{display:flex;gap:10px;align-items:center}.admin-button{border:1px solid var(--line);padding:11px 16px;font-size:11px}.admin-button.gold{background:var(--gold);border-color:var(--gold);color:#fff}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:42px}.admin-stat{border:1px solid var(--line);padding:22px;background:#fff}.admin-stat small{color:var(--muted);font-size:10px}.admin-stat strong{display:block;font:500 32px var(--serif);color:var(--gold);margin-top:8px}.admin-layout{display:grid;grid-template-columns:330px 1fr;gap:30px}.admin-panel{border:1px solid var(--line);padding:24px;background:#fff}.admin-panel h3{font:500 27px var(--serif);margin:0 0 20px}.admin-form{display:grid;gap:12px}.admin-form label{font-size:10px;color:var(--muted)}.admin-form input,.admin-form select,.admin-form textarea{display:block;width:100%;border:1px solid var(--line);padding:11px;margin-top:6px;outline:0}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:right;padding:13px 8px;border-bottom:1px solid #eee;font-size:11px}.admin-table th{color:var(--muted);font-weight:500}.admin-table td strong{font-family:var(--serif);font-size:19px}.admin-table button{color:#a23b31;font-size:11px}.admin-message{min-height:20px;font-size:11px;color:var(--gold)}@media(max-width:800px){.admin-shell{padding:22px 16px}.admin-top{align-items:flex-start;flex-direction:column}.admin-grid{grid-template-columns:1fr 1fr}.admin-layout{grid-template-columns:1fr}.admin-table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-top"><a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>ADMIN</small></span></a><div class="admin-actions"><a class="admin-button" href="/">عرض المتجر</a><button class="admin-button" id="logoutButton">تسجيل الخروج</button></div></header>
    <div class="section-heading"><div><p class="eyebrow">CONTROL ROOM</p><h1>لوحة الإدارة</h1></div></div>
    <section class="admin-grid" aria-label="الإحصاءات"><div class="admin-stat"><small>إجمالي المنتجات</small><strong id="statProducts">--</strong></div><div class="admin-stat"><small>إجمالي الطلبات</small><strong id="statOrders">--</strong></div><div class="admin-stat"><small>إجمالي العملاء</small><strong id="statCustomers">--</strong></div><div class="admin-stat"><small>الإيرادات</small><strong id="statRevenue">-- DH</strong></div><div class="admin-stat"><small>طلبات قيد الانتظار</small><strong id="statPending">--</strong></div><div class="admin-stat"><small>طلبات مكتملة</small><strong id="statDelivered">--</strong></div><div class="admin-stat"><small>مخزون منخفض</small><strong id="statLowStock">--</strong></div></section>
    <div class="admin-layout">
      <section class="admin-panel"><h3>إضافة منتج</h3><form id="productForm" class="admin-form"><label>اسم المنتج<input name="name" required></label><label>الفئة<input name="category" value="Signature Collection" required></label><label>الجنس<select name="gender"><option>Unisex</option><option>Men</option><option>Women</option></select></label><label>السعر DH<input name="price" type="number" min="0" required></label><label>المخزون<input name="stock" type="number" min="0" value="10" required></label><label>الحجم<input name="volume" value="50ml"></label><label>رابط الصورة<input name="image" type="url"></label><label>الوصف<textarea name="description" rows="3"></textarea></label><button class="admin-button gold" type="submit">حفظ المنتج</button><p id="formMessage" class="admin-message"></p></form></section>
      <section class="admin-panel"><h3>المنتجات <small id="productTotal"></small></h3><table class="admin-table"><thead><tr><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>إجراء</th></tr></thead><tbody id="productRows"><tr><td colspan="5">جاري التحميل...</td></tr></tbody></table></section>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('katana-token');
    const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
    const money = value => `${Number(value || 0).toLocaleString('fr-MA')} DH`;
    const request = async (url, options = {}) => { const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } }); const data = await response.json(); if (!response.ok) throw new Error(data.message || 'تعذر تنفيذ العملية'); return data; };
    async function guard() { if (!token) return location.href = '/login.html'; const data = await request('/api/auth/me'); if (data.user.role !== 'admin') return location.href = '/'; }
    async function loadSummary() { const data = await request('/api/admin/summary'); document.getElementById('statProducts').textContent = data.products; document.getElementById('statOrders').textContent = data.orders; document.getElementById('statCustomers').textContent = data.customers; document.getElementById('statRevenue').textContent = money(data.revenue); document.getElementById('statPending').textContent = data.pending; document.getElementById('statDelivered').textContent = data.delivered; document.getElementById('statLowStock').textContent = data.lowStock; }
    async function loadProducts() { const data = await request('/api/products?limit=100'); document.getElementById('productTotal').textContent = `(${data.total})`; document.getElementById('productRows').innerHTML = data.products.map(product => `<tr><td><strong>${product.name}</strong></td><td>${product.category}</td><td>${money(product.price)}</td><td>${product.stock}</td><td><button data-delete="${product._id}">أرشفة</button></td></tr>`).join('') || '<tr><td colspan="5">لا توجد منتجات</td></tr>'; document.querySelectorAll('[data-delete]').forEach(button => button.onclick = () => archiveProduct(button.dataset.delete)); }
    async function archiveProduct(id) { if (!confirm('هل تريد أرشفة هذا المنتج؟')) return; try { await request(`/api/products/${id}`, { method: 'DELETE' }); await Promise.all([loadSummary(), loadProducts()]); } catch (error) { alert(error.message); } }
    document.getElementById('productForm').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target); const data = Object.fromEntries(form); data.price = Number(data.price); data.stock = Number(data.stock); data.images = data.image ? [data.image] : []; delete data.image; try { await request('/api/products', { method: 'POST', body: JSON.stringify(data) }); event.target.reset(); document.getElementById('formMessage').textContent = 'تم حفظ المنتج بنجاح'; await Promise.all([loadSummary(), loadProducts()]); } catch (error) { document.getElementById('formMessage').textContent = error.message; } };
    document.getElementById('logoutButton').onclick = () => { localStorage.removeItem('katana-token'); localStorage.removeItem('katana-user'); location.href = '/login.html'; };
    guard().then(() => Promise.all([loadSummary(), loadProducts()])).catch(() => location.href = '/login.html');
  </script>
</body>
</html>
