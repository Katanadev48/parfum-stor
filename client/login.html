<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول | KATANA PARFUM</title>
  <link rel="stylesheet" href="/client/css/style.css">
</head>
<body>
  <div class="section" style="max-width:520px">
    <a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>PARFUM</small></span></a>
    <div class="section-heading" style="margin-top:70px">
      <div><p class="eyebrow">WELCOME BACK</p><h2>مرحبًا بعودتك</h2></div>
    </div>
    <form id="loginForm" class="finder-form" style="color:#111">
      <label>البريد الإلكتروني<input name="email" type="email" required></label>
      <label>كلمة المرور<input name="password" type="password" required></label>
      <button class="button button-gold" type="submit">دخول <span>←</span></button>
    </form>
    <p id="loginMessage" role="alert" aria-live="polite"></p>
    <a class="text-link" href="/register.html">إنشاء حساب جديد</a>
  </div>
  <script>
    document.getElementById('loginForm').onsubmit = async event => {
      event.preventDefault();
      const message = document.getElementById('loginMessage');
      message.textContent = 'جاري تسجيل الدخول...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(event.target)))
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر تسجيل الدخول');

        localStorage.setItem('katana-token', data.token);
        localStorage.setItem('katana-user', JSON.stringify(data.user));
        location.href = data.user.role === 'admin' ? '/admin/dashboard.html' : '/';
      } catch (error) {
        message.textContent = error instanceof TypeError
          ? 'تعذر الاتصال بالخادم. حاول مرة أخرى لاحقًا.'
          : error.message;
      }
    };
  </script>
</body>
</html>
