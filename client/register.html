<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | KATANA PARFUM</title><link rel="stylesheet" href="/client/css/style.css"></head><body><div class="section" style="max-width:520px"><a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>PARFUM</small></span></a><div class="section-heading" style="margin-top:70px"><div><p class="eyebrow">JOIN KATANA</p><h2>أنشئ حسابك</h2></div></div><form id="registerForm" class="finder-form" style="color:#111"><label>الاسم الكامل<input name="name" required maxlength="80"></label><label>البريد الإلكتروني<input name="email" type="email" required maxlength="254"></label><label>كلمة المرور<input name="password" type="password" minlength="8" required></label><button class="button button-gold" type="submit">إنشاء الحساب <span>←</span></button></form><p id="registerMessage" role="alert" aria-live="polite"></p><a class="text-link" href="/login.html">لديك حساب؟ تسجيل الدخول</a></div><script>document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const button=form.querySelector('button[type="submit"]');const message=document.getElementById('registerMessage');button.disabled=true;message.textContent='جاري إنشاء الحساب...';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)throw new Error(d.message||'تعذر إنشاء الحساب');localStorage.setItem('katana-token',d.token);localStorage.setItem('katana-user',JSON.stringify(d.user));location.href='/'}catch(error){message.textContent=error instanceof TypeError?'تعذر الاتصال بالخادم. تحقق من إعدادات الخدمة وحاول مجددًا.':error.message;button.disabled=false}}</script></body></html>
