<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | KATANA PARFUM</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="section"><a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>PARFUM</small></span></a><div class="section-heading" style="margin-top:70px"><div><p class="eyebrow">MY KATANA</p><h2>حسابي</h2></div></div><div id="accountContent"></div></div><script>async function go(){const t=localStorage.getItem('katana-token');if(!t)return location.href='/login.html';const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}});const d=await r.json();document.getElementById('accountContent').innerHTML='<h3>'+d.user.name+'</h3><p>'+d.user.email+'</p><a class="button button-gold" href="/">العودة للمتجر</a>'}go()</script></body></html>
