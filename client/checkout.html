<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إتمام الطلب | KATANA PARFUM</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="section" style="max-width:800px">
    <a class="brand" href="/">
      <span class="brand-mark">K</span>
      <span>KATANA <small>PARFUM</small></span>
    </a>
    <div class="section-heading" style="margin-top:60px">
      <div><p class="eyebrow">CHECKOUT</p><h2>أكمل طلبك</h2></div>
    </div>
    <section id="orderSummary" class="empty-state" aria-live="polite"></section>
    <form id="checkoutForm" class="finder-form" style="color:#111">
      <label>الاسم الكامل<input name="name" autocomplete="name" maxlength="80" required></label>
      <label>رقم الهاتف<input name="phone" type="tel" autocomplete="tel" maxlength="30" required></label>
      <label>المدينة<input name="city" autocomplete="address-level2" maxlength="100" required></label>
      <label style="grid-column:1/-1">العنوان بالتفصيل<input name="address" autocomplete="street-address" maxlength="300" required></label>
      <label style="grid-column:1/-1">ملاحظة للتوصيل (اختياري)<textarea name="notes" rows="4" maxlength="1000" placeholder="مثال: النهار أو الوقت المناسب للتوصيل"></textarea></label>
      <button class="button button-gold" type="submit">أرسل الطلب عبر واتساب <span>←</span></button>
    </form>
    <p id="checkoutMessage" role="status" aria-live="polite"></p>
  </main>
  <script>
    const summary = document.getElementById('orderSummary');
    const checkoutForm = document.getElementById('checkoutForm');
    const checkoutMessage = document.getElementById('checkoutMessage');
    const money = amount => `${Number(amount || 0).toLocaleString('fr-MA')} DH`;
    const whatsappNumber = '212778379244';

    let cart;
    try {
      cart = JSON.parse(localStorage.getItem('katana-cart') || '[]');
      if (!Array.isArray(cart)) cart = [];
    } catch {
      cart = [];
    }

    function renderSummary() {
      summary.replaceChildren();
      if (!cart.length) {
        summary.textContent = 'سلتك فارغة حاليًا.';
        checkoutForm.querySelector('button[type="submit"]').disabled = true;
        return;
      }

      const heading = document.createElement('h3');
      heading.textContent = 'ملخص سلتك';
      const list = document.createElement('ul');
      let total = 0;
      for (const item of cart) {
        const quantity = Number(item.quantity) || 0;
        const price = Number(item.price) || 0;
        total += price * quantity;
        const row = document.createElement('li');
        row.textContent = `${item.name || 'عطر'} × ${quantity} — ${money(price * quantity)}`;
        list.append(row);
      }
      const subtotal = document.createElement('strong');
      subtotal.textContent = `المجموع التقديري: ${money(total)}`;
      summary.append(heading, list, subtotal);
    }

    renderSummary();

    checkoutForm.onsubmit = async event => {
      event.preventDefault();
      if (!cart.length) return;

      const button = checkoutForm.querySelector('button[type="submit"]');
      const customer = Object.fromEntries(new FormData(checkoutForm));
      button.disabled = true;
      checkoutMessage.textContent = 'جارٍ تسجيل الطلب...';
      const whatsappWindow = window.open('about:blank', '_blank');
      if (whatsappWindow) whatsappWindow.opener = null;

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: cart.map(({ product, quantity }) => ({ product, quantity })),
            customer
          })
        });
        const contentType = response.headers.get('content-type') || '';
        const order = contentType.includes('application/json') ? await response.json() : null;
        if (!response.ok) {
          throw new Error(order?.message || `تعذر تسجيل الطلب (HTTP ${response.status})`);
        }
        if (!order?.orderId) throw new Error('استجابة الخادم غير مكتملة. حاول مرة أخرى.');

        const lines = [
          'طلب جديد من KATANA PARFUM',
          `رقم الطلب: ${order.orderId}`,
          '',
          ...order.items.map(item => `- ${item.name} × ${item.quantity}: ${money(item.price * item.quantity)}`),
          `المجموع: ${money(order.total)}`,
          '',
          `الاسم: ${customer.name}`,
          `الهاتف: ${customer.phone}`,
          `المدينة: ${customer.city}`,
          `العنوان: ${customer.address}`
        ];
        if (customer.notes.trim()) lines.push(`ملاحظة التوصيل: ${customer.notes.trim()}`);
        const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(lines.join('\n'))}`;
        if (whatsappWindow) whatsappWindow.location.href = whatsappUrl;
        else {
          const link = document.createElement('a');
          link.href = whatsappUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'اضغط هنا لإرسال الطلب عبر واتساب';
          checkoutMessage.replaceChildren(document.createTextNode(`تسجل الطلب ${order.orderId}. `), link);
        }

        localStorage.removeItem('katana-cart');
        cart = [];
        renderSummary();
        checkoutForm.reset();
        checkoutMessage.insertAdjacentText('beforeend', ` تسجل الطلب ${order.orderId}. تأكد من إرسال رسالة واتساب للتواصل معك.`);
      } catch (error) {
        if (whatsappWindow) whatsappWindow.close();
        checkoutMessage.textContent = error.message;
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
