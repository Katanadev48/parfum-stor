<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | KATANA PARFUM</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="section" style="max-width:800px"><a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>PARFUM</small></span></a><div class="section-heading" style="margin-top:60px"><div><p class="eyebrow">CHECKOUT</p><h2>أكمل طلبك</h2></div></div><form id="checkoutForm" class="finder-form" style="color:#111"><label>الاسم الكامل<input name="name" required></label><label>الهاتف<input name="phone" required></label><label>البريد الإلكتروني<input name="email" type="email"></label><label>المدينة<input name="city" required></label><label style="grid-column:1/-1">العنوان<input name="address" required></label><label style="grid-column:1/-1">ملاحظات إضافية<textarea name="notes" rows="4"></textarea></label><button class="button button-gold" type="submit">تأكيد الطلب بالدفع عند الاستلام <span>←</span></button></form><p id="checkoutMessage"></p></div><script>const cart=JSON.parse(localStorage.getItem('katana-cart')||'[]');document.getElementById('checkoutForm').onsubmit=async e=>{e.preventDefault();if(!cart.length)return document.getElementById('checkoutMessage').textContent='السلة فارغة';const data=Object.fromEntries(new FormData(e.target));try{const token=localStorage.getItem('katana-token');const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({items:cart,customer:data})});const o=await r.json();if(!r.ok)throw Error(o.message);localStorage.removeItem('katana-cart');document.getElementById('checkoutMessage').textContent='تم تأكيد طلبك: '+o.orderId;e.target.reset()}catch(err){document.getElementById('checkoutMessage').textContent=err.message}}</script></body></html>
