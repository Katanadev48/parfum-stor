<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | KATANA PARFUM</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="section"><a class="brand" href="/"><span class="brand-mark">K</span><span>KATANA <small>ADMIN</small></span></a><div class="section-heading" style="margin-top:70px"><div><p class="eyebrow">CONTROL ROOM</p><h2>لوحة الإدارة</h2></div><a class="button button-ghost" href="/">عرض المتجر</a></div><div class="category-strip" style="margin-bottom:50px"><div><span id="productCount">--</span><b>المنتجات</b></div><div><span>MongoDB</span><b>مصدر البيانات</b></div><div><span>JWT</span><b>حماية الدخول</b></div><div><span>COD</span><b>الدفع المتاح</b></div></div><h3>إدارة المنتجات</h3><div id="adminProducts" class="product-grid"></div></div><script>async function load(){const t=localStorage.getItem('katana-token');if(!t)return location.href='/login.html';const auth=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}});const account=await auth.json();if(!auth.ok||account.user.role!=='admin')return location.href='/';const r=await fetch('/api/products?limit=50');const d=await r.json();document.getElementById('productCount').textContent=d.total;document.getElementById('adminProducts').innerHTML=d.products.map(p=>'<article class="product-card"><div class="product-info"><small>'+p.category+'</small><h3>'+p.name+'</h3><div class="product-meta"><strong>'+p.price+' DH</strong><span>Stock: '+p.stock+'</span></div></div></article>').join('')}load()</script></body></html>
